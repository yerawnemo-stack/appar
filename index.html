<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Mina appar</title>
  <style>
    :root {
      --bg: #0f1013;
      --panel: #17191e;
      --panel-hover: #20232a;
      --text: #f5f6f8;
      --muted: #a8adb7;
      --line: rgba(255,255,255,.09);
      --accent: #8ab4ff;
      --shadow: 0 18px 50px rgba(0,0,0,.24);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(82, 115, 255, .16), transparent 28rem),
        radial-gradient(circle at 100% 15%, rgba(103, 232, 249, .08), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(42px, env(safe-area-inset-top)) 0
               max(48px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.4rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
      padding-bottom: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search {
      position: relative;
      flex: 1;
    }

    .search span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      color: var(--text);
      outline: none;
      padding: 0 16px 0 44px;
    }

    .search input:focus {
      border-color: rgba(138,180,255,.65);
      box-shadow: 0 0 0 4px rgba(138,180,255,.09);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      padding: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.052), rgba(255,255,255,.025));
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    }

    .card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 34px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      font-size: 1.7rem;
    }

    .card h2 {
      margin: auto 0 6px;
      font-size: 1.25rem;
      letter-spacing: -.02em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.45;
    }

    .arrow {
      position: absolute;
      top: 22px;
      right: 22px;
      color: var(--muted);
      font-size: 1.15rem;
      transition: transform .18s ease, color .18s ease;
    }

    .card:hover .arrow {
      transform: translate(2px,-2px);
      color: var(--text);
    }

    .empty {
      display: none;
      padding: 48px 0;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      header { align-items: start; }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 22px, 1100px); padding-top: 28px; }
      header { display: block; margin-bottom: 22px; }
      .count { display: none; }
      .intro { margin-top: 14px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card { min-height: 154px; padding: 18px; }
      .icon { margin-bottom: 22px; width: 46px; height: 46px; border-radius: 13px; }
      .arrow { top: 18px; right: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">App Center</p>
        <h1>Mina appar</h1>
        <p class="intro">
          En samlingsplats för små verktyg, spel och experiment.
          Sidan fungerar lika bra på dator som på telefon.
        </p>
      </div>
      <div class="count" id="count"></div>
    </header>

    <div class="toolbar">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Sök bland appar…" autocomplete="off">
      </label>
    </div>

    <section class="grid" id="appGrid" aria-label="Appar"></section>
    <div class="empty" id="empty">Ingen app matchar sökningen.</div>

    <footer>
      Lägg varje app i samma GitHub-repository och ändra bara adressen i
      <strong>apps</strong>-listan längst ned i den här filen.
    </footer>
  </main>

  <script>
    /*
      ============================================================
      ÄNDRA HÄR NÄR DU VILL LÄGGA TILL, TA BORT ELLER DÖPA OM APPAR.
      ============================================================

      url kan vara:
        "guitar.html"              om appen är en html-fil
        "guitar/"                  om appen ligger i en egen mapp
        "https://example.com"      om appen ligger någon annanstans

      Kopiera ett objekt och ändra uppgifterna för att lägga till en app.
    */

    const apps = [
      {
        name: "Gitarrhals",
        description: "Skalor, toner och övning på greppbrädan.",
        icon: "🎸",
        url: "gitarr/"
      },
      {
        name: "Reportern",
        description: "Spel och experiment i Stockholmsmiljö.",
        icon: "📰",
        url: "reportern.html"
      },
      {
        name: "Doom-motor",
        description: "Förstapersonsmotor och spelvärld.",
        icon: "🎮",
        url: "doom.html"
      },
      {
        name: "Sommarskolan",
        description: "Quiz och träningsmodul.",
        icon: "📚",
        url: "matteskola/"
      },
      {
        name: "Rubiks kub",
        description: "3D-visualisering och träningsverktyg.",
        icon: "🧩",
        url: "cube.html"
      },
      {
        name: "Ny app",
        description: "Ersätt den här rutan med nästa projekt.",
        icon: "＋",
        url: "#"
      }
    ];

    const grid = document.getElementById("appGrid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    function renderApps(query = "") {
      const q = query.trim().toLocaleLowerCase("sv");
      const visible = apps.filter(app =>
        `${app.name} ${app.description}`.toLocaleLowerCase("sv").includes(q)
      );

      grid.innerHTML = visible.map(app => `
        <a class="card" href="${escapeHtml(app.url)}"
           ${/^https?:\/\//.test(app.url) ? 'target="_blank" rel="noopener noreferrer"' : ''}>
          <span class="arrow" aria-hidden="true">↗</span>
          <div class="icon" aria-hidden="true">${escapeHtml(app.icon)}</div>
          <h2>${escapeHtml(app.name)}</h2>
          <p>${escapeHtml(app.description)}</p>
        </a>
      `).join("");

      count.textContent = `${visible.length} ${visible.length === 1 ? "app" : "appar"}`;
      empty.style.display = visible.length ? "none" : "block";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    search.addEventListener("input", event => renderApps(event.target.value));
    renderApps();
  </script>
</body>
</html>
