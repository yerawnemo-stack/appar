const DATA={"modules": [{"id": "hola", "title": "Hej, det är jag", "icon": "👋", "desc": "Hälsa och presentera dig", "lesson": "Små fraser räcker långt. H i hola är stumt. ¿ och ? ramar in en fråga. Börja gärna med att lyssna och säga efter."}, {"id": "numbers", "title": "Siffror & ålder", "icon": "🎈", "desc": "0–20 och hur gammal du är", "lesson": "På spanska HAR man sina år: tengo trece años = jag är tretton år. ñ är en egen bokstav, ungefär som nj. Den behövs i años."}, {"id": "family", "title": "Min familj", "icon": "🏡", "desc": "Familjeord och presentationer", "lesson": "Lär dig gärna artikeln tillsammans med ordet: el hermano, la hermana. Mi betyder min eller mitt. Här är exempel med en person i taget."}, {"id": "articles", "title": "Un eller una?", "icon": "🧩", "desc": "Artiklar och enkla skolord", "lesson": "Un och una betyder en/ett. Un hör till maskulina ord, una till feminina. Lär in hela ordparet. Slutet -o eller -a hjälper ofta, men inte alltid: un día, en dag."}, {"id": "tener", "title": "Tener · att ha", "icon": "✨", "desc": "Lärarens fokus: presens", "lesson": "Tener är oregelbundet: tengo, tienes, tiene, tenemos, tenéis, tienen. Tú = du, él/ella = han/hon, nosotros/as = vi, vosotros/as = ni (informellt i Spanien), ellos/ellas = de. Usted använder tiene; ustedes använder tienen."}, {"id": "estar", "title": "Estar · må & befinna sig", "icon": "📍", "desc": "Lärarens fokus: presens", "lesson": "Estar används här för hur någon mår och var någon eller något befinner sig: estoy bien, estoy en casa. Böjning: estoy, estás, está, estamos, estáis, están. Accenterna hör till stavningen."}, {"id": "ar", "title": "Verb på -ar", "icon": "💬", "desc": "Lärarens fokus: regelbundna verb", "lesson": "Ta bort -ar från grundformen och lägg till rätt ändelse. I ordningen yo, tú, él/ella, nosotros/as, vosotros/as, ellos/ellas: o, as, a, amos, áis, an. Exempel: hablar = att tala."}, {"id": "er", "title": "Verb på -er", "icon": "🍎", "desc": "Lärarens fokus: regelbundna verb", "lesson": "Ta bort -er från grundformen och lägg till rätt ändelse. I ordningen yo, tú, él/ella, nosotros/as, vosotros/as, ellos/ellas: o, es, e, emos, éis, en. Exempel: comer = att äta."}, {"id": "ir", "title": "Verb på -ir", "icon": "🌵", "desc": "Lärarens fokus: regelbundna verb", "lesson": "Ta bort -ir från grundformen och lägg till rätt ändelse. I ordningen yo, tú, él/ella, nosotros/as, vosotros/as, ellos/ellas: o, es, e, imos, ís, en. Exempel: vivir = att bo."}, {"id": "ser", "title": "Ser eller estar?", "icon": "☀️", "desc": "Identitet, plats och känsla", "lesson": "Ser används här för identitet och ursprung: soy Ana, soy de Suecia. Estar för plats och tillstånd: estoy en casa, estoy bien. Regeln ”alltid/tillfälligt” räcker inte! Ser: soy, eres, es, somos, sois, son."}, {"id": "city", "title": "En la ciudad", "icon": "🏙️", "desc": "Platser i staden", "lesson": "¿Dónde está…? betyder Var ligger/finns…? Hay betyder det finns. Lärarens kapitel heter En la ciudad. Orden här är ett eget urval, inte en avskrift ur läroboken."}, {"id": "everyday", "title": "Min vardag", "icon": "🎒", "desc": "Mat, intressen, färger och dagar", "lesson": "Me gusta används med en sak eller ett verb: me gusta la música, me gusta bailar. Med flera saker blir det me gustan. Här tränar vi enkla fraser i singular."}, {"id": "dialog", "title": "Små samtal", "icon": "💜", "desc": "Fråga, svara och våga prata", "lesson": "Läs gärna replikerna högt. Du behöver inte förstå varje ord för att förstå situationen. Be om hjälp med ¿Puedes repetir? eller Más despacio, por favor."}, {"id": "world", "title": "Spanska i världen", "icon": "🌎", "desc": "Länder och små läsuppdrag", "lesson": "Spanska används i många länder och låter olika på olika platser. I Spanien hör du ofta vosotros/as; i Latinamerika används ustedes för ni. Spanien ligger i Europa. Mexiko, Colombia, Peru, Chile och Argentina ligger i Latinamerika."}, {"id": "read", "title": "Läs en liten stund", "icon": "📖", "desc": "Hitta information i korta texter", "lesson": "Leta efter det frågan gäller. Ett namn? En plats? En ålder? Du kan förstå mycket även om ett ord är nytt. Svara på spanska, med bara det efterfrågade ordet eller talet."}], "cards": [{"id": "hola-0", "m": "hola", "sv": "hej", "es": "hola", "note": "", "alt": []}, {"id": "hola-1", "m": "hola", "sv": "hej då", "es": "adiós", "note": "", "alt": []}, {"id": "hola-2", "m": "hola", "sv": "god morgon", "es": "buenos días", "note": "", "alt": []}, {"id": "hola-3", "m": "hola", "sv": "god eftermiddag / god kväll", "es": "buenas tardes", "note": "", "alt": []}, {"id": "hola-4", "m": "hola", "sv": "god natt", "es": "buenas noches", "note": "", "alt": []}, {"id": "hola-5", "m": "hola", "sv": "tack", "es": "gracias", "note": "", "alt": []}, {"id": "hola-6", "m": "hola", "sv": "snälla / är du snäll", "es": "por favor", "note": "", "alt": []}, {"id": "hola-7", "m": "hola", "sv": "Hur mår du?", "es": "¿Cómo estás?", "note": "", "alt": []}, {"id": "hola-8", "m": "hola", "sv": "Jag mår bra.", "es": "Estoy bien.", "note": "", "alt": []}, {"id": "hola-9", "m": "hola", "sv": "Vad heter du?", "es": "¿Cómo te llamas?", "note": "", "alt": []}, {"id": "hola-10", "m": "hola", "sv": "Jag heter Ana.", "es": "Me llamo Ana.", "note": "", "alt": []}, {"id": "hola-11", "m": "hola", "sv": "Och du?", "es": "¿Y tú?", "note": "", "alt": []}, {"id": "hola-12", "m": "hola", "sv": "Vi ses!", "es": "¡Hasta luego!", "note": "", "alt": []}, {"id": "hola-13", "m": "hola", "sv": "Jag är från Sverige.", "es": "Soy de Suecia.", "note": "", "alt": []}, {"id": "hola-14", "m": "hola", "sv": "Jag bor i Stockholm.", "es": "Vivo en Estocolmo.", "note": "", "alt": []}, {"id": "numbers-0", "m": "numbers", "sv": "0", "es": "cero", "note": "", "alt": []}, {"id": "numbers-1", "m": "numbers", "sv": "1", "es": "uno", "note": "", "alt": []}, {"id": "numbers-2", "m": "numbers", "sv": "2", "es": "dos", "note": "", "alt": []}, {"id": "numbers-3", "m": "numbers", "sv": "3", "es": "tres", "note": "", "a const KEY='pappas-spanska-v1', DAY=86400000;
const blank=()=>({version:1,xp:0,sessions:0,days:[],progress:{},custom:[],active:null,spoken:0});
let state=blank(),storageOK=true,tab='path',round=null,chosen=[],answered=false,currentMode='',helpUsed=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;}localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}
function valid(s){return s&&s.version===1&&Number.isFinite(s.xp)&&s.xp>=0&&Number.isFinite(s.sessions)&&s.sessions>=0&&Array.isArray(s.days)&&s.days.every(x=>typeof x==='string')&&s.progress&&typeof s.progress==='object'&&!Array.isArray(s.progress)&&Object.values(s.progress).every(p=>p&&Number.isFinite(p.due)&&Array.isArray(p.wins)&&p.wins.every(x=>typeof x==='string')&&Number.isFinite(p.seen))&&Array.isArray(s.custom)&&s.custom.length<=500&&s.custom.every(c=>c&&typeof c.id==='string'&&/^c-[a-zA-Z0-9-]+$/.test(c.id)&&c.m==='custom'&&typeof c.sv==='string'&&typeof c.es==='string'&&c.es.length<500&&Array.isArray(c.alt)&&c.alt.every(a=>typeof a==='string'));}
function save(){if(round)state.active=round;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}document.getElementById('xp').textContent='✦ '+state.xp+' XP'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function all(){return [...DATA.cards,...state.custom]}
function card(id){return all().find(c=>c.id===id)}
function progress(c){return state.progress[c.id]||{seen:0,wins:[],due:0}}
function mastered(c){return progress(c).wins.length>=3}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(html){document.getElementById('app').innerHTML=html;window.scrollTo(0,0);document.getElementById('xp').textContent='✦ '+state.xp+' XP'}
function home(){if(round){save()}round=null;const total=all().filter(mastered).length;const active=state.active;
show(`<section class="hero"><div><span class="eyebrow">Lite spanska. Stor skillnad.</span><h1>Ett litet steg<br>är också framåt.</h1><p>Fyra saker i taget. Några minuter för dig.<br>Du behöver inte kunna redan — du är här för att lära.</p><button class="primary full" onclick="start('auto')">${state.sessions?'Dagens lilla pass':'Börja med ett litet ¡hola!'} &nbsp; →</button></div><div class="sun" aria-hidden="true"><span>✦</span></div></section>
${active?'<div class="notice between"><span>Du har ett påbörjat pass.</span><button class="soft" onclick="resume()">Fortsätt</button></div>':''}
${!storageOK?'<div class="notice">Webbläsaren kunde inte spara dina framsteg. Använd säkerhetskopian under För vuxna innan du stänger.</div>':''}
<section class="stats"><div class="stat"><b>${state.sessions}</b><small>små pass gjorda</small></div><div class="stat"><b>${total}</b><small>sitter över tid</small></div><div class="stat"><b>${state.days.length}</b><small>dagar du har övat</small></div></section>
<nav aria-label="Avdelningar">${[['path','Din väg'],['focus','Nöta extra'],['rewards','Samlingen'],['adult','För vuxna']].map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';home()">${t}</button>`).join('')}</nav><section id="panel"></section><p class="foot">En liten stund räcker. Alla framsteg räknas. ♡</p>`);

function tile(m,i){let cs=all().filter(c=>c.m===m.id),n=cs.filter(mastered).length;return `<article class="tile"><button class="cover" onclick="modulePage('${m.id}')"><span class="icon">${m.icon}</span><small>STEG ${String(i+1).padStart(2,'0')}</small><h3>${esc(m.title)}</h3><small>${esc(m.desc)}</small><div class="track"><i style="width:${n/cs.length*100}%"></i></div><small>${n} / ${cs.length} sitter över tid</small></button></article>`}
function modulePage(id){const m=DATA.modules.find(x=>x.id===id);const cs=all().filter(c=>c.m===id);show(`<div class="narrow"><button class="secondary" onclick="home()">← Till din väg</button><h1>${m.icon} ${esc(m.title)}</h1><div class="lesson">${esc(m.lesson)}</div><button class="primary full" onclick="start('${id}')">Öva fyra saker →</button><div class="card"><h2>Upptäck orden</h2><p class="muted">Läs, lyssna om ljud finns och säg gärna efter.</p>${cs.map(c=>`<div class="study"><div class="between"><b lang="es">${esc(c.es)}</b><button class="speak" onclick="speakCard('${c.id}')" aria-label="Lyssna på ${esc(c.es)}">♪ Lyssna</button></div><div>${esc(c.sv)}</div>${c.note?`<small class="muted">${esc(c.note)}</small>`:''}</div>`).join('')}</div><p id="audioStatus" class="muted" role="status"></p></div>`)}
function start(scope){if(state.active&&!confirm('Starta ett nytt pass? Det påbörjade passet avslutas, men redan sparade svar finns kvar.'))return;let pool=all();if(scope==='auto'){const due=pool.filter(c=>progress(c).seen&&progress(c).due<=Date.now());if(due.length)pool=due;else{const next=DATA.modules.find(m=>pool.some(c=>c.m===m.id&&progress(c).seen===0));pool=pool.filter(c=>c.m===(next?.id||'hola'));}}else if(scope==='teacher')pool=pool.filter(c=>['tener','estar','ar','er','ir'].includes(c.m));else if(scope==='review')pool=pool.filter(c=>progress(c).seen);else pool=pool.filter(c=>c.m===scope);
if(!pool.length){show(`<div class="card center"><h2>${scope==='custom'?'Lägg till några glosor först':'Här finns inget att repetera ännu'}</h2><p>Börja med ett litet pass, så får orden en plats här.</p><button class="primary" onclick="home()">Till startsidan</button></div>`);return}
const used=pool.filter(c=>progress(c).seen);const unseen=pool.filter(c=>!progress(c).seen);const due=shuffle(used.filter(c=>progress(c).due<=Date.now())).sort((a,b)=>progress(a).wins.length-progress(b).wins.length);const candidates=[...due.slice(0,2),...unseen,...due.slice(2),...shuffle(used.filter(c=>progress(c).due>Date.now()))];const ids=[...new Set(candidates.map(c=>c.id))].slice(0,4);
round={scope,ids,queue:[...ids.map(id=>({id,mode:'choice'})),...shuffle(ids).map(id=>({id,mode:'write'}))],at:0,phase:'study',first:0,gain:0,retry:[],feedback:null};save();study()}
function resume(){const r=state.active;if(!r||!Array.isArray(r.queue)||!r.queue.every(q=>card(q.id))||!Array.isArray(r.ids)||!r.ids.every(id=>card(id))||!Number.isInteger(r.at)||r.at<0||r.at>=r.queue.length){state.active=null;round=null;save();home();return}round=r;if(round.phase==='study')study();else ask()}
function study(){show(`<div class="narrow"><div class="between"><button class="secondary" onclick="home()">← Pausa</button><span class="pill">1 · Titta först</span></div><h1>${round.ids.length===4?'Fyra':round.ids.length} små byggstenar.</h1><p class="muted">Titta en stund. Säg dem gärna högt. Sedan provar du själv.</p><div class="card">${round.ids.map(id=>{const c=card(id);return `<div class="study"><div class="between"><b lang="es">${esc(c.es)}</b><button class="speak" onclick="speakCard('${id}')">♪ Lyssna</button></div><div>${esc(c.sv)}</div>${c.note?`<small class="muted">${esc(c.note)}</small>`:''}</div>`}).join('')}</div><p id="audioStatus" class="muted" role="status"></p><button class="primary full" onclick="round.phase='quiz';save();ask()">Nu provar jag →</button></div>`)}
function ask(){if(round.at>=round.queue.length){finish();return}const q=round.queue[round.at],c=card(q.id);currentMode=q.mode;answered=false;chosen=[];helpUsed=false;const base=round.ids.length*2;show(`<div class="narrow"><div class="between"><button class="secondary" onclick="home()">← Pausa</button><span class="pill">${round.at<base?`${round.at+1} av ${base}`:'En extra chans'} · ${q.mode==='choice'?'Välj':'Minns själv'}</span></div><div class="track"><i style="width:${round.at/round.queue.length*100}%"></i></div><div class="card"><span class="eyebrow">${q.mode==='choice'?'Hitta rätt på spanska':q.mode==='retry'?'Vi provar igen, tillsammans':'Skriv på spanska'}</span><h2 class="question">${esc(c.sv)}</h2><div id="answerArea"></div><div id="feedback" aria-live="polite"></div></div><p class="center muted">Ingen tidspress. Du får tänka i lugn och ro.</p></div>`);
const area=document.getElementById('answerArea');if(q.mode==='choice'){let same=all().filter(x=>x.m===c.m&&norm(x.es)!==norm(c.es)&&!c.alt.some(a=>norm(a)===norm(x.es)));let opts=shuffle([...new Set([c.es,...shuffle(same).map(x=>x.es).slice(0,3)])]);if(opts.length<2)opts=[c.es,'…'];area.innerHTML='<div class="options">'+opts.map((x,i)=>`<button class="choice" lang="es" data-option="${i}">${esc(x)}</button>`).join('')+'</div>';area.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>check(opts[i]));}else{area.innerHTML=`<form id="answerForm"><label class="sr" for="answer">Ditt svar på spanska</label><input id="answer" type="text" lang="es" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Skriv här…" enterkeyhint="done"><div class="keys">${'áéíóúüñ¿¡'.split('').map(x=>`<button type="button" onclick="insertChar('${x}')">${x}</button>`).join('')}</div><button class="primary full" type="submit">Kolla svaret</button></form><div class="row" style="margin-top:16px"><button class="secondary" id="hintBtn" onclick="hint()">Lite hjälp</button>${c.es.split(' ').length>1?'<button class="secondary" id="buildBtn" onclick="buildWords()">Bygg med ord</button>':''}</div><p id="hintText" class="muted"></p>`;document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();check(document.getElementById('answer').value)};}
if(round.feedback){answered=true;renderFeedback(round.feedback)}save()}
function insertChar(ch){const el=document.getElementById('answer');if(!el||answered)return;const a=el.selectionStart,b=el.selectionEnd;el.setRangeText(ch,a,b,'end');el.focus()}
function hint(){if(answered)return;helpUsed=true;round.queue[round.at].help=true;save();const c=card(round.queue[round.at].id);document.getElementById('hintText').textContent=`Börjar med ”${c.es.slice(0,2)}…”. ${c.note||'Du kan det här bit för bit.'}`}
function buildWords(){if(answered)return;helpUsed=true;round.queue[round.at].help=true;save();currentMode='build';const c=card(round.queue[round.at].id);const tokens=shuffle(c.es.split(' ').map((t,i)=>({t,i})));document.getElementById('answerArea').innerHTML=`<div class="sentence" id="sentence" aria-label="Din mening"></div><div id="words">${tokens.map(x=>`<button class="word" id="w${x.i}" lang="es">${esc(x.t)}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="primary" onclick="check(chosen.map(x=>x.t).join(' '))">Kolla meningen</button><button class="secondary" onclick="buildWords()">Börja om</button></div><p class="muted">Tryck på orden i rätt ordning. Detta är träning med stöd.</p>`;tokens.forEach(x=>document.getElementById('w'+x.i).onclick=()=>{if(answered)return;chosen.push(x);document.getElementById('w'+x.i).disabled=true;document.getElementById('sentence').textContent=chosen.map(x=>x.t).join(' ')});chosen=[]}
function norm(s){return s.normalize('NFC').toLowerCase().replace(/[¿?¡!.,:;«»"“”]/g,'').replace(/\s+/g,' ').trim()}
function accent(s){return norm(s).replace(/[áéíóúü]/g,c=>({'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u'}[c]))}
function check(value){if(answered||!value.trim())return;answered=true;const q=round.queue[round.at],c=card(q.id),accepted=[c.es,...c.alt];let exact=accepted.some(a=>norm(a)===norm(value)),near=!exact&&accepted.some(a=>accent(a)===accent(value));let p=progress(c);p.seen++;let independent=q.mode==='write'&&currentMode==='write'&&!helpUsed&&!q.help;
if(exact&&independent){if(!p.wins.includes(today()))p.wins.push(today());p.due=Date.now()+[1,3,7,14][Math.min(3,p.wins.length-1)]*DAY}else if(!exact){p.wins=[];p.due=Date.now()+10*60000}else if(!p.due){p.due=Date.now()+DAY}
state.progress[c.id]=p;const xp=exact?10:near?7:3;state.xp+=xp;round.gain+=xp;if(exact&&q.mode!=='retry')round.first++;if(!exact&&!round.retry.includes(c.id)&&round.retry.length<2){round.retry.push(c.id);round.queue.push({id:c.id,mode:'retry'})}
round.feedback={exact,near,value,es:c.es,note:c.note,independent,xp};save();renderFeedback(round.feedback)}
function renderFeedback(f){document.querySelectorAll('#answerArea button,#answerArea input').forEach(x=>x.disabled=true);const title=f.exact?['¡Muy bien!','Där satt den!','Ett steg framåt!'][round.at%3]:f.near?'Du har ordet! Putsa accenten.':'Nu har du en ny ledtråd.';document.getElementById('feedback').innerHTML=`<div class="feedback ${f.exact?'':'almost'} pop"><b>${title} <span style="font-size:13px">+${f.xp} XP</span></b>${!f.exact?`<p class="muted">Du skrev: ${esc(f.value)}</p>`:''}<p lang="es" style="font-size:23px">${esc(f.es)}</p><p>${f.exact?(f.independent?'Du plockade fram det ur minnet. Snyggt jobbat!':'Bra träning. Snart får du minnas själv.'):f.near?'Betoningen hör till ordet. Du får träna formen igen.':'Läs svaret och säg det gärna högt. Det är så man lär sig.'} ${esc(f.note)}</p><button class="speak" onclick="speakCard('${round.queue[round.at].id}')">♪ Lyssna</button><p id="audioStatus" class="muted" role="status"></p><button class="primary full" onclick="next()">${round.at+1>=round.queue.length?'Se mitt lilla framsteg':'Vidare'} →</button></div>`}
function next(){if(!answered)return;round.at++;round.feedback=null;save();ask()}
function finish(){const gain=round.gain+20,first=round.first,n=round.ids.length*2,scope=round.scope;state.xp+=20;state.sessions++;if(!state.days.includes(today()))state.days.push(today());round=null;state.active=null;save();show(`<div class="narrow center"><div class="card pop"><div class="big">🌟</div><span class="eyebrow">Ett litet pass. Ett riktigt framsteg.</span><h1>¡Bien hecho!</h1><p>Du gav spanskan en stund.<br>Det är precis så den får fäste.</p><div class="stats"><div class="stat"><b>+${gain}</b><small>XP med passbonus</small></div><div class="stat"><b>${first}/${n}</b><small>rätt i grundpasset</small></div><div class="stat"><b>${state.sessions}</b><small>pass totalt</small></div></div><p class="muted">Nu får du gärna vara klar för idag. Orden väntar här när du vill tillbaka.</p><button class="primary full" onclick="home()">Klart för nu ♡</button><div class="row" style="justify-content:center;margin-top:20px"><button class="secondary" onclick="start('${scope}')">Ett litet pass till</button><button class="secondary" onclick="tab='rewards';home()">Min samling</button></div></div></div>`)}
function speakCard(id){const c=card(id);speak(c.es)}
function speak(text){const out=document.getElementById('audioStatus');const msg=t=>{if(out)out.textContent=t};if(!('speechSynthesis'in window)){msg('Ljudstödet saknas här. Läs texten och säg efter någon som kan spanska.');return}const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='es-ES')||voices.find(v=>v.lang.startsWith('es'));if(!voice){msg('Ingen spansk röst hittades i webbläsaren. Du kan fortfarande läsa och öva alla kort.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=.8;u.onerror=()=>msg('Ljudet kunde inte spelas. Försök igen, eller fortsätt utan ljud.');u.onend=()=>msg('Säg gärna efter i din egen takt.');speechSynthesis.speak(u);msg('Lyssna och säg gärna efter.');}
function rewards(el){const badges=[['🌱','Första steget','Gör ett pass',state.sessions>=1],['🌼','Det börjar växa','Gör fem pass',state.sessions>=5],['🌻','Tio små stunder','Gör tio pass',state.sessions>=10],['🦋','Tillbaka igen','Öva tre olika dagar',state.days.length>=3],['💎','Fem som sitter','Minns fem kort på tre dagar',all().filter(mastered).length>=5],['🎤','Våga prata','Gör en muntlig ministund',(state.spoken||0)>0],['🚀','På väg','Samla 1 000 XP',state.xp>=1000],['🌈','En vana som växer','Öva sju olika dagar',state.days.length>=7]];el.innerHTML=`<h2>Din lilla samling</h2><p class="muted">Du behåller alltid dina märken. En paus tar ingenting ifrån dig.</p><div class="grid">${badges.map(b=>`<div class="badge ${b[3]?'':'locked'}"><div class="icon">${b[0]}</div><h3>${b[1]}</h3><small>${b[3]?'✓ Ditt!':b[2]}</small></div>`).join('')}</div><h2>De senaste sju dagarna</h2><div class="week">${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<span class="day ${state.days.includes(key)?'done':''}" title="${key}">${['S','M','T','O','T','F','L'][d.getDay()]}</span>`}).join('')}</div><p class="muted">Färgade dagar är övningsdagar. Tomma dagar är bara andra dagar.</p>`}
function speakLab(){show(`<div class="narrow"><button class="secondary" onclick="home()">← Tillbaka</button><h1>En minut med din röst.</h1><p>Prova med en vuxen, eller spela båda rollerna själv. Appen lyssnar inte och bedömer inte ditt uttal.</p><div class="card"><h2>Träffa en ny kompis</h2><p lang="es">— ¡Hola! ¿Cómo te llamas?<br>— Me llamo … ¿Y tú?<br>— Me llamo … ¿Cuántos años tienes?<br>— Tengo … años.<br>— ¿Tienes hermanos?<br>— Sí, tengo … / No, no tengo hermanos.</p><details><summary>Lite svensk hjälp</summary><p>Hej! Vad heter du? Jag heter … Och du? Hur gammal är du? Jag är … år. Har du syskon? Ja, jag har … / Nej, jag har inga syskon.</p></details><button class="speak" onclick="speak('Hola. ¿Cómo te llamas? ¿Cuántos años tienes? ¿Tienes hermanos?')">♪ Hör frågorna</button><p id="audioStatus" role="status" class="muted"></p></div><div class="card"><h3>Din egen lilla presentation</h3><p>Säg eller skriv tre meningar: vad du heter, hur gammal du är och något du gillar. Byt sedan en uppgift och prova igen.</p><label for="myText">Här kan du skriva som stöd (sparas inte)</label><textarea id="myText" placeholder="Me llamo…"></textarea><details><summary>Ett exempel att jämföra med</summary><p lang="es">Me llamo Ana. Tengo trece años. Me gusta leer.</p><p>Kontrollera tillsammans: fick du med namn, ålder med tener och ett intresse? Det finns många möjliga rätta svar.</p></details></div><button class="primary full" onclick="state.spoken=(state.spoken||0)+1;save();tab='rewards';home()">Jag har övat högt ✓</button></div>`)}
function customPage(){show(`<div class="narrow"><button class="secondary" onclick="home()">← Tillbaka</button><h1>Mina läxglosor.</h1><p>Klistra in en glosa per rad: <b>svenska = spanska</b>. Nya ord läggs till. Befintliga ord behålls.</p><label for="customInput">Din gloslista</label><textarea id="customInput" placeholder="hunden = el perro&#10;katten = el gato&#10;Jag har en hund. = Tengo un perro."></textarea><p class="muted">Använd lärarens stavning. De egna glosorna språkgranskas inte automatiskt.</p><button class="primary" onclick="addCustom()">Spara glosorna</button><p id="customStatus" role="status"></p><div class="card"><h2>${state.custom.length} egna glosor</h2>${state.custom.length?'<button class="soft" onclick="start(\'custom\')">Öva mina glosor →</button>':''}${state.custom.map(c=>`<div class="study"><b>${esc(c.es)}</b> · ${esc(c.sv)}</div>`).join('')}</div></div>`)}
function addCustom(){const rows=document.getElementById('customInput').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!rows.length)return;const bad=rows.find(r=>r.indexOf('=')<1||!r.slice(r.indexOf('=')+1).trim()||r.length>450);if(bad){document.getElementById('customStatus').textContent='Kontrollera formatet: svenska = spanska. Ingen rad får vara tom på ena sidan eller längre än 450 tecken.';return}if(rows.length+state.custom.length>500){document.getElementById('customStatus').textContent='Det ryms högst 500 egna glosor.';return}let added=0;rows.forEach(r=>{const i=r.indexOf('='),sv=r.slice(0,i).trim(),es=r.slice(i+1).trim();if(!state.custom.some(c=>norm(c.sv)===norm(sv)&&norm(c.es)===norm(es))){state.custom.push({id:'c-'+Date.now()+'-'+added,m:'custom',sv,es,alt:[],note:''});added++}});save();customPage();document.getElementById('customStatus').textContent=`${added} nya glosor sparade.`}
function adult(el){el.innerHTML=`<h2>En trygg liten träningsrutin</h2><div class="card"><p><b>Börja med ett pass om dagen, cirka 3–5 minuter.</b> Välj gärna Hej, det är jag först. Inför verbglosorna finns Veckans verb under Nöta extra. Låt henne sluta efter ett pass om hon vill.</p><p>Varje pass introducerar högst fyra kort och har åtta grundfrågor: känna igen, sedan skriva ur minnet. Högst två extra försök tillkommer. Tidigare kort planeras för repetition efter 1, 3, 7 och 14 dagar. Fel eller accentmissar gör att kortet kommer tillbaka tidigare.</p><p>Framstegsmåttet kräver självständiga skrivsvar på tre olika dagar. Ledtrådar och ordbygge ger XP men räknas inte som självständigt minne. Accenter rättas vänligt; ñ räknas som egen bokstav. Skiljetecken och stora/små bokstäver hindrar inte ett rätt svar.</p><p>Lägg gärna till en minut muntligt samtal. Korta appar ersätter inte samtal, lärarens återkoppling eller varierad hörförståelse.</p></div>
<div class="card"><h2>Kursplanen och den här appen</h2><p><b>Nationellt:</b> Moderna språk inom språkval har centralt innehåll för åk 4–6 respektive 7–9. Det finns ingen nationell spansk gloslista, angiven ordmängd eller lista över verb som måste vara avklarade just i åk 7.</p><p><b>Slutet av åk 6, E-nivå:</b> Förstå vanliga enkla ord och fraser när man lyssnar och läser, uttrycka sig mycket enkelt och huvudsakligen begripligt muntligt och skriftligt, delta i enkelt samspel med stödstrategier samt mycket enkelt kommentera förhållanden där språket används.</p><p><b>Åk 7–9:</b> Undervisningen breddas till bland annat aktiviteter, känslor, erfarenheter, kultur, språkliga strukturer och mer sammanhängande kommunikation. Det finns inga separata nationella betygskriterier för slutet av åk 7. Planeringen avgör vilka delar som behandlas då.</p><p><b>Vårt övningsmål för åk 7:</b> Kunna presentera sig, ställa och besvara vardagsfrågor, förstå korta texter och samtal samt skriva några enkla meningar. Detta är appens pedagogiska urval, inte en officiell årskurslista.</p><p><a href="https://syllabuswebb.skolverket.se/subject/GRGRMSP01/15/pdf" target="_blank" rel="noopener">Skolverkets kursplan, moderna språk (gäller från 1 juli 2024)</a>. Kontrollerad 16 september 2026.</p><p><b>Lärarens bilder:</b> Familj, ålder, tal till 20, un/una, tener, estar och regelbundna -ar/-er/-ir-verb samt enkel dialog. Lärobokens sida 12, övning 16, syns inte i underlaget; dialogerna och glosurvalet här är därför egna.</p><p>Appen är ett komplement med tonvikt på grunderna och den aktuella läxan, inte en komplett kurs eller betygsbedömning. <a href="https://www.rae.es/dpd/ayuda/modelos-de-conjugacion-verbal" target="_blank" rel="noopener">RAE:s verbmodeller</a> är språkstöd.</p></div>
<div class="card"><h2>Framsteg per område</h2><p class="muted">”Sett” betyder övat minst en gång. ”Sitter” kräver tre separata dagar med självständiga skrivsvar.</p><table><thead><tr><th>Område</th><th>Sett</th><th>Sitter</th></tr></thead><tbody>${DATA.modules.map(m=>{const cs=all().filter(c=>c.m===m.id);return `<tr><td>${esc(m.title)}</td><td>${cs.filter(c=>progress(c).seen>0).length}/${cs.length}</td><td>${cs.filter(mastered).length}</td></tr>`}).join('')}</tbody></table></div>
<div class="card"><h2>Spara & flytta framsteg</h2><p>Framsteg sparas i den här webbläsaren på den här adressen, utan konto. En annan enhet, privat läge, rensad webbdata eller flyttad fil kan ge en ny historik. Ta en säkerhetskopia när ni vill behålla eller flytta den.</p><div class="row"><button class="secondary" onclick="backup()">Hämta säkerhetskopia</button><label class="secondary" style="cursor:pointer">Läs in säkerhetskopia<input type="file" id="restore" accept="application/json,.json" style="display:none" onchange="restoreFile(this.files[0])"></label></div><p id="restoreStatus" role="status"></p><details><summary>Teknik och ljud</summary><p>En fristående HTML-fil med inbyggd kod och övningsbank. Själva träningen behöver inga externa filer. För smidig användning på iPhone: lägg filen på din webbserver, öppna adressen i Safari och välj Lägg till på hemskärmen.</p><p>Uppläsning använder webbläsarens spanska talsyntesröst om en sådan finns. Tillgång, uttal och eventuell nätanslutning beror på enheten. Appen spelar inte in ljud. Den bedömer inte uttal, och lyssnaknappar är inte ett fullständigt hörförståelseprov.</p></details><details><summary>Börja om helt</summary><p>Raderar framsteg och egna glosor från denna webbläsare.</p><button class="danger" onclick="resetAll()">Nollställ appen</button></details></div>`}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='spanska-framsteg-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function restoreFile(file){if(!file)return;try{if(file.size>2000000)throw Error();const s=JSON.parse(await file.text());if(!valid(s))throw Error();if(!confirm('Ersätta den här webbläsarens framsteg och egna glosor med säkerhetskopian?'))return;s.active=null;state=s;round=null;save();home();document.getElementById('restoreStatus').textContent='Säkerhetskopian är inläst.'}catch(e){document.getElementById('restoreStatus').textContent='Filen kunde inte läsas. Välj en giltig säkerhetskopia från appen.'}}
function resetAll(){if(!confirm('Radera alla framsteg och egna glosor? Ta gärna en säkerhetskopia först.'))return;state=blank();round=null;save();home()}
if('speechSynthesis'in window)speechSynthesis.getVoices();home();
